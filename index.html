async function getProfile(userId){
 const {data,error}=await db.from("profiles")
  .select("id,username,avatar_url,username_changed_at")
  .eq("id",userId).maybeSingle();
 if(error){console.error(error);return null}
 return data;
}

function daysUntilUsernameChange(profile){
 if(!profile?.username||!profile.username_changed_at)return 0;
 const changed=new Date(profile.username_changed_at).getTime();
 const sevenDays=7*24*60*60*1000;
 const remaining=sevenDays-(Date.now()-changed);
 return Math.max(0,Math.ceil(remaining/(24*60*60*1000)));
}

 name.textContent=profile?.username?"@"+profile.username:"مستخدم MOAD SHORTS";

}

async function saveProfile(){
 const username=document.getElementById("newUsername").value.trim();
 if(username.length<3||username.length>24)
  return showMessage("اسم المستخدم لازم يكون من 3 إلى 24 حرفاً");

 const button=document.getElementById("saveProfile");
 button.disabled=true;
 showMessage("جاري حفظ الاسم...");

 const {error}=await db.from("profiles")
  .upsert({id:currentUser.id,username},{onConflict:"id"});

 button.disabled=false;

 if(error){
  if(error.code==="23505")
   return showMessage("اسم المستخدم مستخدم من شخص آخر. اختار اسماً مختلفاً.");
  if(error.message.toLowerCase().includes("7 days")||
     error.message.toLowerCase().includes("seven"))
   return showMessage("لا يمكنك تغيير اسم المستخدم إلا مرة كل 7 أيام.");
  return showMessage("حدث خطأ: "+error.message);
 }

 currentProfile=await getProfile(currentUser.id);
 updateAvatarButton();
 showMessage("تم حفظ الملف الشخصي بنجاح!");
 await showProfile(currentUser.id);
}

 avatarInput.value="";
};

function shuffle(items){
 for(let i=items.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [items[i],items[j]]=[items[j],items[i]];
 }
 return items;
}

function stopAllVideos(except=null){
 document.querySelectorAll(".video-card video").forEach(video=>{
  if(video!==except){
   video.pause();
   video.muted=true;
   video.closest(".video-card").classList.add("paused");
  }
 });
}

function playVideo(video){
 stopAllVideos(video);
 video.muted=!soundEnabled;
 video.play().then(()=>{
  video.closest(".video-card").classList.remove("paused");
  activeVideo=video;
 }).catch(()=>{
  video.closest(".video-card").classList.add("paused");
 });
}

// احتساب مشاهدة واحدة للحساب الواحد لكل فيديو
function setupViewTracking(video,item,countElement){
 if(!item?.id)return;

 let timer=null;
 let sent=false;

 video.addEventListener("playing",()=>{
  if(!currentUser||sent||viewedThisPage.has(item.id))return;

  clearTimeout(timer);
  timer=setTimeout(async()=>{
   if(!currentUser||video.paused||video.ended)return;

   sent=true;
   viewedThisPage.add(item.id);

   const {data,error}=await db.rpc("increment_video_views",{
    video_id:item.id
   });

   if(error){
    console.error("View count error:",error);
    sent=false;
    viewedThisPage.delete(item.id);
    return;
   }

   const total=Number(data)||0;
   item.view_count=total;

   if(countElement)countElement.textContent="👁️ "+total+" مشاهدة";

   const viewerItem=viewer.dataset.videoId===item.id;
   if(viewerItem){
    document.getElementById("viewerViews").textContent=
     "👁️ "+total+" مشاهدة";
   }
  },2000);
 });

 video.addEventListener("pause",()=>clearTimeout(timer));
 video.addEventListener("ended",()=>clearTimeout(timer));
}

function openVideoViewer(item){
 if(!item?.video_url)return;

 stopAllVideos();
 activeVideo=null;

 viewer.dataset.videoId=item.id||"";
 viewer.style.display="flex";
 viewerVideo.pause();
 viewerVideo.src=item.video_url;
 viewerVideo.load();

 document.getElementById("viewerViews").textContent=
  "👁️ "+(item.view_count||0)+" مشاهدة";

 document.getElementById("viewerDescription").textContent=
  item.description||"";

 setupViewTracking(
  viewerVideo,
  item,
  document.getElementById("viewerViews")
 );

 viewerVideo.play().catch(()=>{});
}

function closeVideoViewer(){
 viewerVideo.pause();
 viewerVideo.removeAttribute("src");
 viewerVideo.load();
 viewer.style.display="none";
 viewer.dataset.videoId="";
}

document.getElementById("closeViewer").onclick=closeVideoViewer;
viewer.addEventListener("click",e=>{
 if(e.target===viewer)closeVideoViewer();
});

function createCard(url,description="",category="all",item=null){
 const card=document.createElement("section");
 card.className="video-card";
 card.dataset.category=category;

 const video=document.createElement("video");
 video.playsInline=true;
 video.setAttribute("webkit-playsinline","");
 video.preload="metadata";

 const source=document.createElement("source");
 source.src=url;
 source.type="video/mp4";
 video.appendChild(source);

 const button=document.createElement("button");
 button.className="play-button";
 button.textContent="▶";

 const info=document.createElement("div");
 info.className="video-info";

 const owner=document.createElement("div");
 owner.className="owner-name";

 if(item?.username){
  owner.textContent="@"+item.username;
  owner.onclick=e=>{
   e.stopPropagation();
   showProfile(item.user_id);
  };
 }else if(item?.user_id){
  owner.textContent="عرض الملف الشخصي";
  owner.onclick=e=>{
   e.stopPropagation();
   showProfile(item.user_id);
  };
 }

 const desc=document.createElement("p");
 desc.textContent=description;

 const count=document.createElement("span");
 count.className="view-count";
 count.textContent=item?.id?
  "👁️ "+(item.view_count||0)+" مشاهدة":"";

 info.append(owner,desc,count);
 card.append(video,button,info);
 card.classList.add("paused");

 if(item?.id){
  setupViewTracking(video,item,count);
 }

 if(item?.id&&currentUser&&item.user_id===currentUser.id){
  const del=document.createElement("button");
  del.className="delete-button";
  del.textContent="حذف الفيديو";

  del.onclick=async(e)=>{
   e.stopPropagation();
   if(!confirm("هل أنت متأكد من حذف هذا الفيديو؟"))return;

   del.disabled=true;
   del.textContent="جاري الحذف...";

   const {error}=await db.from("videos").delete()
    .eq("id",item.id).eq("user_id",currentUser.id);

   if(error){
    alert("تعذر حذف الفيديو: "+error.message);
    del.disabled=false;
    del.textContent="حذف الفيديو";
    return;
   }

   const path=getVideoStoragePath(url);
   if(path)await db.storage.from("videos").remove([path]);

   await loadVideos();
  };

  card.appendChild(del);
 }

 card.addEventListener("click",event=>{
  if(event.target===button||event.target===video){
   if(video.paused)playVideo(video);
   else{
    video.pause();
    card.classList.add("paused");
   }
  }
 });

 video.addEventListener("ended",()=>card.classList.add("paused"));
 video.addEventListener("error",()=>card.classList.add("paused"));

 return card;
}

function getVideoStoragePath(url){
 const marker="/storage/v1/object/public/videos/";
 try{
  const index=url.indexOf(marker);
  if(index===-1)return null;
  return decodeURIComponent(url.substring(index+marker.length));
 }catch(e){return null}
}

async function loadVideos(){
 stopAllVideos();
 activeVideo=null;
 feed.innerHTML="";

 let cards=[];

 oldVideos.forEach(url=>{
  cards.push(createCard(url,"","all"));
 });

 const {data,error}=await db.from("videos")
  .select("id,user_id,video_url,description,created_at,view_count")
  .order("created_at",{ascending:false});

 if(error){
  console.error(error);
 }else if(data){
  const userIds=[...new Set(data.map(v=>v.user_id).filter(Boolean))];
  let profiles={};

  if(userIds.length){
   const result=await db.from("profiles")
    .select("id,username").in("id",userIds);

   if(!result.error&&result.data){
    result.data.forEach(p=>profiles[p.id]=p.username);
   }
  }

  data.forEach(item=>{
   cards.push(createCard(
    item.video_url,
    item.description||"",
    "all",
    {...item,username:profiles[item.user_id]||""}
   ));
  });
 }

 shuffle(cards);
 cards.forEach(card=>feed.appendChild(card));

 animeVideos.forEach(v=>feed.appendChild(
  createCard(v.url,v.description||"","anime")
 ));
 movieVideos.forEach(v=>feed.appendChild(
  createCard(v.url,v.description||"","movies")
 ));
 storyVideos.forEach(v=>feed.appendChild(
  createCard(v.url,v.description||"","stories")
 ));

 if(observer)observer.disconnect();

 observer=new IntersectionObserver(entries=>{
  const visible=entries.filter(entry=>entry.isIntersecting)
   .sort((a,b)=>b.intersectionRatio-a.intersectionRatio)[0];

  if(visible&&visible.intersectionRatio>=0.7){
   const video=visible.target.querySelector("video");
   if(activeVideo!==video||video.paused)playVideo(video);
  }
 },{threshold:[0,0.7,1]});

 document.querySelectorAll(".video-card").forEach(card=>{
  observer.observe(card);
 });

 applyTab(currentTab);
}

function applyTab(category){
 currentTab=category;
 stopAllVideos();
 activeVideo=null;
 feed.scrollTop=0;

 document.querySelectorAll(".empty").forEach(item=>item.remove());

 let visibleCount=0;

 document.querySelectorAll(".video-card").forEach(card=>{
  const show=card.dataset.category===category;
  card.style.display=show?"flex":"none";
  if(show)visibleCount++;
 });

 if(visibleCount===0){
  const empty=document.createElement("div");
  empty.className="empty";

  const messages={
   all:"لا توجد فيديوهات حالياً",
   anime:"لا توجد فيديوهات أنمي حالياً",
   movies:"لا توجد فيديوهات أفلام حالياً",
   stories:"لا توجد قصص حالياً"
  };

  empty.textContent=messages[category];
  feed.appendChild(empty);
 }
}

document.querySelectorAll(".tab").forEach(tab=>{
 tab.onclick=()=>{
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  tab.classList.add("active");
  applyTab(tab.dataset.tab);
 };
});

soundButton.onclick=()=>{
 soundEnabled=!soundEnabled;
 if(activeVideo)activeVideo.muted=!soundEnabled;
 soundButton.textContent=soundEnabled?
  "🔊 الصوت مفتوح":"🔇 الصوت مغلق";
};

uploadButton.onclick=()=>{
 if(currentTab!=="all"){
  alert("النشر متاح في قسم لك فقط");
  return;
 }
 if(!currentUser){
  showAuth();
  return;
 }
 fileInput.click();
};

function validateVideo(file){
 return new Promise((resolve,reject)=>{
  if(!file.type.startsWith("video/")){
   reject("الملف المختار مش فيديو");
   return;
  }

  if(file.size>50*1024*1024){
   reject("حجم الفيديو أكبر من 50 MB");
   return;
  }

  const video=document.createElement("video");
  video.preload="metadata";
  video.muted=true;

  video.onloadedmetadata=()=>{
   URL.revokeObjectURL(video.src);

   if(!Number.isFinite(video.duration)||video.duration<=0)
    reject("تعذر قراءة مدة الفيديو");
   else if(video.duration>90)
    reject("مدة الفيديو أطول من 90 ثانية");
   else if(video.videoHeight<=video.videoWidth)
    reject("لازم الفيديو يكون عمودي");
   else resolve(true);
  };

  video.onerror=()=>{
   URL.revokeObjectURL(video.src);
   reject("تعذر قراءة الفيديو");
  };

  video.src=URL.createObjectURL(file);
 });
}

fileInput.onchange=async()=>{
 const file=fileInput.files[0];
 if(!file)return;

 if(!currentUser){
  fileInput.value="";
  showAuth();
  return;
 }

 openModal();

 panelContent.innerHTML=`
 <h2>نشر فيديو</h2>
 <textarea id="description" placeholder="اكتب وصف الفيديو (اختياري)"></textarea>
 <p id="status">جاري فحص الفيديو...</p>`;

 try{
  await validateVideo(file);
 }catch(error){
  showMessage(error);
  fileInput.value="";
  return;
 }

 panelContent.innerHTML=`
 <h2>نشر فيديو</h2>
 <textarea id="description" placeholder="اكتب وصف الفيديو (اختياري)"></textarea>
 <button class="action" id="publish">نشر الآن</button>
 <p class="note">الفيديو عمودي، مدته لا تتجاوز 90 ثانية وحجمه لا يتجاوز 50 MB.</p>
 <p id="status"></p>`;

 document.getElementById("publish").onclick=async()=>{
  const button=document.getElementById("publish");
  const description=document.getElementById("description").value.trim();

  button.disabled=true;
  showMessage("جاري رفع الفيديو... لا تغلق الصفحة");

  try{
   const {data:sessionData}=await db.auth.getSession();
   const user=sessionData.session?.user;

   if(!user)throw new Error("سجل دخولك من جديد");

   const ext=(file.name.split(".").pop()||"mp4").toLowerCase();
   const path=user.id+"/"+crypto.randomUUID()+"."+ext;

   const {error:uploadError}=await db.storage.from("videos")
    .upload(path,file,{contentType:file.type,upsert:false});

   if(uploadError)throw uploadError;

   const {data:urlData}=db.storage.from("videos").getPublicUrl(path);

   const {error:insertError}=await db.from("videos").insert({
    user_id:user.id,
    video_url:urlData.publicUrl,
    description
   });

   if(insertError){
    await db.storage.from("videos").remove([path]);
    throw insertError;
   }

   showMessage("تم نشر الفيديو بنجاح! 🎉");
   fileInput.value="";

   setTimeout(async()=>{
    closeModal();
    currentTab="all";

    document.querySelectorAll(".tab").forEach(t=>{
     t.classList.toggle("active",t.dataset.tab==="all");
    });

    await loadVideos();
   },1000);

  }catch(error){
   showMessage("حدث خطأ: "+error.message);
   button.disabled=false;
  }
 };
};

async function initialize(){
 const {data}=await db.auth.getSession();
 await updateUser(data.session?.user||null);
 await loadVideos();
}

initialize();
</script>
