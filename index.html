
<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>MOAD SHORTS</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  background: black;
  overflow: hidden;
}

#feed {
  width: 100%;
  height: 100dvh;
  overflow: hidden;
  position: relative;
}

.video-box {
  width: 100%;
  height: 100%;
  position: absolute;
  inset: 0;
  background: black;
  display: none;
}

.video-box.active {
  display: block;
}

video {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}
</style>
</head>

<body>

<div id="feed">

  <div class="video-box active">
    <video playsinline muted loop controls>
      <source src="./2026-10-21-131624724.mp4" type="video/mp4">
    </video>
  </div>

  <div class="video-box">
    <video playsinline muted loop controls>
      <source src="./video2.mp4" type="video/mp4">
    </video>
  </div>

</div>

<script>
const boxes = [...document.querySelectorAll(".video-box")];
let current = 0;
let startY = 0;
let startX = 0;
let changing = false;

function showVideo(index) {
  if (index < 0 || index >= boxes.length || changing) return;

  changing = true;

  boxes[current].querySelector("video").pause();
  boxes[current].classList.remove("active");

  current = index;

  boxes[current].classList.add("active");

  const video = boxes[current].querySelector("video");
  video.currentTime = 0;
  video.play().catch(() => {});

  setTimeout(() => changing = false, 350);
}

document.addEventListener("touchstart", e => {
  startY = e.touches[0].clientY;
  startX = e.touches[0].clientX;
}, { passive: true });

document.addEventListener("touchend", e => {
  const endY = e.changedTouches[0].clientY;
  const endX = e.changedTouches[0].clientX;

  const diffY = startY - endY;
  const diffX = startX - endX;

  if (Math.abs(diffY) > 60 && Math.abs(diffY) > Math.abs(diffX)) {
    if (diffY > 0) showVideo(current + 1);
    else showVideo(current - 1);
  }
}, { passive: true });

boxes[0].querySelector("video").play().catch(() => {});
</script>

</body>
</html>
