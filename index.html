
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOAD SHORTS</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #000;
  color: white;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

header {
  position: fixed;
  top: 0;
  width: 100%;
  height: 60px;
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(#000b, transparent);
}

.tabs {
  display: flex;
  gap: 28px;
  font-size: 17px;
  font-weight: bold;
}

.tab {
  opacity: .65;
  cursor: pointer;
  padding-bottom: 8px;
}

.tab.active {
  opacity: 1;
  border-bottom: 3px solid white;
}

#soundButton {
  position: fixed;
  top: 75px;
  left: 15px;
  z-index: 2000;
  background: #222b;
  color: white;
  border: 1px solid #777;
  border-radius: 25px;
  padding: 10px 15px;
  font-size: 14px;
}

#feed {
  height: 100dvh;
  overflow-y: scroll;
  scroll-snap-type: y mandatory;
  scrollbar-width: none;
}

#feed::-webkit-scrollbar {
  display: none;
}

.video-card {
  width: 100%;
  height: 100dvh;
  position: relative;
  scroll-snap-align: start;
  background: #000;
  display: flex;
  justify-content: center;
  align-items: center;
}

video {
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: black;
}

.play-button {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  border: none;
  background: #0008;
  color: white;
  font-size: 45px;
  width: 75px;
  height: 75px;
  border-radius: 50%;
  display: none;
}

.video-card.paused .play-button {
  display: block;
}

.empty {
  height: 100dvh;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  color: #aaa;
  font-size: 20px;
  scroll-snap-align: start;
}
</style>
</head>

<body>

<header>
  <div class="tabs">
    <div class="tab active" data-tab="all">لك</div>
    <div class="tab" data-tab="anime">أنمي</div>
    <div class="tab" data-tab="movies">أفلام</div>
  </div>
</header>

<button id="soundButton">🔇 الصوت مغلق</button>

<main id="feed">

  <section class="video-card" data-category="all">
    <video playsinline preload="metadata">
      <source src="https://raw.githubusercontent.com/moad2014/moad-shorts/main/2026-10-21-131624724.mp4" type="video/mp4">
    </video>
    <button class="play-button">▶</button>
  </section>

  <section class="video-card" data-category="all">
    <video playsinline preload="metadata">
      <source src="https://raw.githubusercontent.com/moad2014/moad-shorts/main/video2.mp4" type="video/mp4">
    </video>
    <button class="play-button">▶</button>
  </section>

  <section class="video-card" data-category="all">
    <video playsinline preload="metadata">
      <source src="https://raw.githubusercontent.com/moad2014/moad-shorts/main/video4.mp4" type="video/mp4">
    </video>
    <button class="play-button">▶</button>
  </section>

  <section class="video-card" data-category="all">
    <video playsinline preload="metadata">
      <source src="https://drive.google.com/uc?export=download&id=1VdLElwbmVPStvL7E8h9Uxeq6CXdNSIoT" type="video/mp4">
    </video>
    <button class="play-button">▶</button>
  </section>

</main>

<script>
const feed = document.getElementById("feed");
const soundButton = document.getElementById("soundButton");
const tabs = document.querySelectorAll(".tab");

let soundEnabled = false;
let activeVideo = null;

function stopAllVideos(except = null) {
  document.querySelectorAll("video").forEach(video => {
    if (video !== except) {
      video.pause();
      video.muted = true;
      video.closest(".video-card").classList.add("paused");
    }
  });
}

function playVideo(video) {
  stopAllVideos(video);
  video.muted = !soundEnabled;

  video.play().then(() => {
    video.closest(".video-card").classList.remove("paused");
    activeVideo = video;
  }).catch(() => {
    video.closest(".video-card").classList.add("paused");
  });
}

document.querySelectorAll(".video-card").forEach(card => {
  const video = card.querySelector("video");
  const button = card.querySelector(".play-button");

  card.addEventListener("click", event => {
    if (event.target === button || event.target === video) {
      if (video.paused) {
        playVideo(video);
      } else {
        video.pause();
        card.classList.add("paused");
      }
    }
  });

  video.addEventListener("ended", () => {
    card.classList.add("paused");
  });
});

soundButton.addEventListener("click", () => {
  soundEnabled = !soundEnabled;

  if (activeVideo) {
    activeVideo.muted = !soundEnabled;
  }

  soundButton.textContent = soundEnabled
    ? "🔊 الصوت مفتوح"
    : "🔇 الصوت مغلق";
});

const observer = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    const video = entry.target.querySelector("video");

    if (entry.isIntersecting && entry.intersectionRatio >= 0.7) {
      playVideo(video);
    } else {
      video.pause();
      video.closest(".video-card").classList.add("paused");
    }
  });
}, {
  threshold: [0.7]
});

document.querySelectorAll(".video-card").forEach(card => {
  observer.observe(card);
});

tabs.forEach(tab => {
  tab.addEventListener("click", () => {
    tabs.forEach(item => item.classList.remove("active"));
    tab.classList.add("active");

    stopAllVideos();
    feed.scrollTop = 0;

    const category = tab.dataset.tab;

    document.querySelectorAll(".video-card, .empty").forEach(item => {
      item.style.display = category === "all" ? "flex" : "none";
    });

    if (category !== "all") {
      let message = category === "anime"
        ? "لا توجد فيديوهات أنمي حالياً"
        : "لا توجد فيديوهات أفلام حالياً";

      let empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = message;
      feed.appendChild(empty);
    } else {
      document.querySelectorAll(".empty").forEach(item => item.remove());
    }
  });
});
</script>

</body>
</html>
