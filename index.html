
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MOAD SHORTS</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  background: #000;
  color: white;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 58px;
  z-index: 10;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 35px;
  background: linear-gradient(#000, #000000aa);
}

.tab {
  color: #999;
  font-size: 17px;
  font-weight: bold;
  height: 58px;
  display: flex;
  align-items: center;
  position: relative;
  cursor: pointer;
}

.tab.active {
  color: white;
}

.tab.active::after {
  content: "";
  position: absolute;
  bottom: 7px;
  left: 0;
  right: 0;
  height: 3px;
  background: white;
  border-radius: 10px;
}

.section {
  display: none;
  width: 100%;
  height: 100%;
}

.section.active {
  display: block;
}

.feed {
  width: 100%;
  height: 100%;
  overflow-y: auto;
  overflow-x: hidden;
  scroll-snap-type: y mandatory;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}

.feed::-webkit-scrollbar {
  display: none;
}

.video-box {
  width: 100%;
  height: 100vh;
  height: 100dvh;
  background: black;
  scroll-snap-align: start;
  scroll-snap-stop: always;
}

video {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

.empty {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #888;
  font-size: 18px;
}

#soundButton {
  position: fixed;
  top: 70px;
  left: 15px;
  z-index: 20;
  padding: 11px 16px;
  border: 1px solid #ffffff55;
  border-radius: 25px;
  background: #222222dd;
  color: white;
  font-size: 14px;
  font-weight: bold;
}
</style>
</head>

<body>

<header>
  <div class="tab active" onclick="changeTab('forYou', this)">لك</div>
  <div class="tab" onclick="changeTab('anime', this)">أنمي</div>
  <div class="tab" onclick="changeTab('movies', this)">أفلام</div>
</header>

<button id="soundButton" onclick="toggleSound()">
  🔊 تشغيل الصوت
</button>

<div id="forYou" class="section active">
  <div class="feed">

    <div class="video-box">
      <video playsinline muted loop controls preload="metadata">
        <source src="./2026-10-21-131624724.mp4" type="video/mp4">
      </video>
    </div>

    <div class="video-box">
      <video playsinline muted loop controls preload="metadata">
        <source src="./video2.mp4" type="video/mp4">
      </video>
    </div>

  </div>
</div>

<div id="anime" class="section">
  <div class="empty">لا توجد فيديوهات أنمي حالياً</div>
</div>

<div id="movies" class="section">
  <div class="empty">لا توجد فيديوهات أفلام حالياً</div>
</div>

<script>
const allVideos = [...document.querySelectorAll("video")];
let soundEnabled = false;

function stopAllVideos() {
  allVideos.forEach(video => video.pause());
}

function getCurrentVideo() {
  const section = document.querySelector(".section.active");
  const feed = section.querySelector(".feed");

  if (!feed) return null;

  const index = Math.round(feed.scrollTop / feed.clientHeight);
  return feed.querySelectorAll("video")[index] || null;
}

function playCurrentVideo() {
  const video = getCurrentVideo();

  stopAllVideos();

  if (video) {
    video.muted = !soundEnabled;
    video.play().catch(() => {});
  }
}

function toggleSound() {
  soundEnabled = !soundEnabled;

  const button = document.getElementById("soundButton");

  button.textContent = soundEnabled
    ? "🔇 كتم الصوت"
    : "🔊 تشغيل الصوت";

  const video = getCurrentVideo();

  if (video) {
    video.muted = !soundEnabled;
    video.play().catch(() => {});
  }
}

function changeTab(id, tab) {
  stopAllVideos();

  document.querySelectorAll(".section").forEach(section => {
    section.classList.remove("active");
  });

  document.querySelectorAll(".tab").forEach(item => {
    item.classList.remove("active");
  });

  document.getElementById(id).classList.add("active");
  tab.classList.add("active");

  playCurrentVideo();
}

document.querySelectorAll(".feed").forEach(feed => {
  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      const video = entry.target;

      if (
        entry.isIntersecting &&
        feed.closest(".section").classList.contains("active")
      ) {
        stopAllVideos();
        video.muted = !soundEnabled;
        video.play().catch(() => {});
      } else {
        video.pause();
      }
    });
  }, {
    root: feed,
    threshold: 0.7
  });

  feed.querySelectorAll("video").forEach(video => {
    observer.observe(video);
  });
});
</script>

</body>
</html>
