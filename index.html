 const {data,error}=await db.from("profiles")
  .select("id,username,avatar_url,username_changed_at,is_verified")
  .eq("id",userId).maybeSingle();
 if(error){console.error(error);return null}
 return data;
}

 currentProfile=user?await getProfile(user.id):null;

}

function daysUntilUsernameChange(profile){
 if(!profile?.username||!profile.username_changed_at)return 0;
 const changed=new Date(profile.username_changed_at).getTime();
 const sevenDays=7*24*60*60*1000;
 const remaining=sevenDays-(Date.now()-changed);
 return Math.max(0,Math.ceil(remaining/(24*60*60*1000)));
}

}

async function loadProfileVideos(userId,container){
 container.innerHTML="<p>جاري تحميل الفيديوهات...</p>";

  .select("id,user_id,video_url,description,view_count,created_at")
  .eq("user_id",userId)
  .order("created_at",{ascending:false});

 if(error){
  container.innerHTML="<p>تعذر تحميل الفيديوهات</p>";
  console.error(error);
  return;
 }

 container.innerHTML="";

 if(!data||data.length===0){
  container.innerHTML="<p>لم ينشر هذا المستخدم أي فيديو حتى الآن</p>";
  return;
 }

 data.forEach(item=>{
  const tile=document.createElement("button");
  tile.className="profile-video-item";

  const video=document.createElement("video");
  video.src=item.video_url;
  video.preload="metadata";
  video.muted=true;
  video.playsInline=true;

  const count=document.createElement("span");

  tile.append(video,count);
  tile.onclick=()=>openVideoViewer(item);
  container.appendChild(tile);
 });
}

async function saveProfile(){
 const username=document.getElementById("newUsername").value.trim();
 if(username.length<3||username.length>24)
  return showMessage("اسم المستخدم لازم يكون من 3 إلى 24 حرفاً");

 const button=document.getElementById("saveProfile");
 button.disabled=true;
 showMessage("جاري حفظ الاسم...");

 const {error}=await db.from("profiles")
  .upsert({id:currentUser.id,username},{onConflict:"id"});

 button.disabled=false;

 if(error){
  if(error.code==="23505")
   return showMessage("اسم المستخدم مستخدم من شخص آخر. اختار اسماً مختلفاً.");
  if(error.message.toLowerCase().includes("7 days")||
     error.message.toLowerCase().includes("seven"))
   return showMessage("لا يمكنك تغيير اسم المستخدم إلا مرة كل 7 أيام.");
  return showMessage("حدث خطأ: "+error.message);
 }

 currentProfile=await getProfile(currentUser.id);
 updateAvatarButton();
 showMessage("تم حفظ الملف الشخصي بنجاح!");
 await showProfile(currentUser.id);
}

 const file=avatarInput.files[0];
 if(!file)return;
 if(!file.type.startsWith("image/")){
  showMessage("اختار صورة فقط");avatarInput.value="";return;
 }
 if(file.size>3*1024*1024){
  showMessage("حجم الصورة أكبر من 3 MB");avatarInput.value="";return;
 }

 showMessage("جاري رفع صورة الحساب...");
 const ext=(file.name.split(".").pop()||"jpg").toLowerCase();
 const path=currentUser.id+"/"+crypto.randomUUID()+"."+ext;

 const {error:uploadError}=await db.storage.from("avatars")
  .upload(path,file,{contentType:file.type,upsert:false});

 if(uploadError){
  showMessage("تعذر رفع الصورة: "+uploadError.message);
  avatarInput.value="";
  return;
 }

 const {data:urlData}=db.storage.from("avatars").getPublicUrl(path);
 const {error:updateError}=await db.from("profiles")
  .update({avatar_url:urlData.publicUrl}).eq("id",currentUser.id);

 if(updateError){
  showMessage("تم رفع الصورة لكن تعذر حفظها: "+updateError.message);
  return;
 }

 currentProfile=await getProfile(currentUser.id);
 updateAvatarButton();
 showMessage("تم تغيير صورة الحساب بنجاح!");
 await showProfile(currentUser.id);
 avatarInput.value="";
};

function shuffle(items){
 for(let i=items.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [items[i],items[j]]=[items[j],items[i]];
 }
 return items;
}

function stopAllVideos(except=null){
 document.querySelectorAll(".video-card video").forEach(video=>{
  if(video!==except){
   video.pause();
   video.muted=true;
   video.closest(".video-card").classList.add("paused");
  }
 });
}

function playVideo(video){
 stopAllVideos(video);
 video.muted=!soundEnabled;
 video.play().then(()=>{
  video.closest(".video-card").classList.remove("paused");
  activeVideo=video;
 }).catch(()=>{
  video.closest(".video-card").classList.add("paused");
 });
}

function setupViewTracking(video,item,countElement){
 if(!item?.id)return;

 let timer=null;
 let sent=false;

 video.addEventListener("playing",()=>{
  if(!currentUser||sent||viewedThisPage.has(item.id))return;

  clearTimeout(timer);
  timer=setTimeout(async()=>{
   if(!currentUser||video.paused||video.ended)return;

   sent=true;
   viewedThisPage.add(item.id);

   const {data,error}=await db.rpc("increment_video_views",{
    video_id:item.id
   });

   if(error){
    console.error("View count error:",error);
    sent=false;
    viewedThisPage.delete(item.id);
    return;
   }

   const total=Number(data)||0;
   item.view_count=total;

   if(countElement)countElement.textContent="👁️ "+total+" مشاهدة";

   if(viewer.dataset.videoId===item.id){
    document.getElementById("viewerViews").textContent=
     "👁️ "+total+" مشاهدة";
   }
  },2000);
 });

 video.addEventListener("pause",()=>clearTimeout(timer));
 video.addEventListener("ended",()=>clearTimeout(timer));
}

function openVideoViewer(item){
 if(!item?.video_url)return;

 stopAllVideos();
 activeVideo=null;

 viewer.dataset.videoId=item.id||"";
 viewer.style.display="flex";
 viewerVideo.pause();
 viewerVideo.src=item.video_url;
 viewerVideo.load();

 document.getElementById("viewerViews").textContent=
  "👁️ "+(item.view_count||0)+" مشاهدة";

 document.getElementById("viewerDescription").textContent=
  item.description||"";

 setupViewTracking(
  viewerVideo,
  item,
  document.getElementById("viewerViews")
 );

 viewerVideo.play().catch(()=>{});
}

function closeVideoViewer(){
 viewerVideo.pause();
 viewerVideo.removeAttribute("src");
 viewerVideo.load();
 viewer.style.display="none";
 viewer.dataset.videoId="";
}

document.getElementById("closeViewer").onclick=closeVideoViewer;
viewer.addEventListener("click",e=>{
 if(e.target===viewer)closeVideoViewer();
});

function createCard(url,description="",category="all",item=null){
 const card=document.createElement("section");
 card.className="video-card";
 card.dataset.category=category;

 const video=document.createElement("video");
 video.playsInline=true;
 video.setAttribute("webkit-playsinline","");
 video.preload="metadata";

 const source=document.createElement("source");
 source.src=url;
 source.type="video/mp4";
 video.appendChild(source);

 const button=document.createElement("button");
 button.className="play-button";
 button.textContent="▶";

 const info=document.createElement("div");
 info.className="video-info";

 const owner=document.createElement("div");
 owner.className="owner-name";

 if(item?.username){
  owner.textContent="@"+item.username;
  addVerifiedBadge(owner,item.is_verified);
  owner.onclick=e=>{
   e.stopPropagation();
   showProfile(item.user_id);
  };
 }else if(item?.user_id){
  owner.textContent="عرض الملف الشخصي";
  owner.onclick=e=>{
   e.stopPropagation();
   showProfile(item.user_id);
  };
 }

 const desc=document.createElement("p");
 desc.textContent=description;

 info.append(owner,desc);
 card.append(video,button,info);
 card.classList.add("paused");

 if(item?.id){
  setupViewTracking(video,item,null);
 }

 if(item?.id&&currentUser&&item.user_id===currentUser.id){
  const del=document.createElement("button");
  del.className="delete-button";
  del.textContent="حذف الفيديو";

  del.onclick=async(e)=>{
   e.stopPropagation();
   if(!confirm("هل أنت متأكد من حذف هذا الفيديو؟"))return;

   del.disabled=true;
   del.textContent="جاري الحذف...";

   const {error}=await db.from("videos").delete()
    .eq("id",item.id).eq("user_id",currentUser.id);

   if(error){
    alert("تعذر حذف الفيديو: "+error.message);
    del.disabled=false;
    del.textContent="حذف الفيديو";
    return;
   }

   const path=getVideoStoragePath(url);
   if(path)await db.storage.from("videos").remove([path]);

   await loadVideos();
  };

  card.appendChild(del);
 }

 card.addEventListener("click",event=>{
  if(event.target===button||event.target===video){
   if(video.paused)playVideo(video);
   else{
    video.pause();
    card.classList.add("paused");
   }
  }
 });

 video.addEventListener("ended",()=>card.classList.add("paused"));
 video.addEventListener("error",()=>card.classList.add("paused"));

 return card;
}

function getVideoStoragePath(url){
 const marker="/storage/v1/object/public/videos/";
 try{
  const index=url.indexOf(marker);
  if(index===-1)return null;
  return decodeURIComponent(url.substring(index+marker.length));
 }catch(e){return null}
}

async function loadVideos(){
 stopAllVideos();
 activeVideo=null;
 feed.innerHTML="";

 let cards=[];

 oldVideos.forEach(url=>{
  cards.push(createCard(url,"","all"));
 });

 const {data,error}=await db.from("videos")
  .select("id,user_id,video_url,description,created_at,view_count")
  .order("created_at",{ascending:false});

 if(error){
  console.error(error);
 }else if(data){
  const userIds=[...new Set(data.map(v=>v.user_id).filter(Boolean))];
  let profiles={};

  if(userIds.length){
   const result=await db.from("profiles")
    .select("id,username,is_verified").in("id",userIds);

   if(!result.error&&result.data){
    result.data.forEach(p=>profiles[p.id]=p);
   }
  }

  data.forEach(item=>{
   const profile=profiles[item.user_id]||{};
   cards.push(createCard(
    item.video_url,
    item.description||"",
    "all",
    {
     ...item,
     username:profile.username||"",
     is_verified:profile.is_verified===true
    }
   ));
  });
 }

 shuffle(cards);
 cards.forEach(card=>feed.appendChild(card));

 animeVideos.forEach(v=>feed.appendChild(
  createCard(v.url,v.description||"","anime")
 ));
 movieVideos.forEach(v=>feed.appendChild(
  createCard(v.url,v.description||"","movies")
 ));
 storyVideos.forEach(v=>feed.appendChild(
  createCard(v.url,v.description||"","stories")
 ));

 if(observer)observer.disconnect();

 observer=new IntersectionObserver(entries=>{
  const visible=entries.filter(entry=>entry.isIntersecting)
   .sort((a,b)=>b.intersectionRatio-a.intersectionRatio)[0];

  if(visible&&visible.intersectionRatio>=0.7){
   const video=visible.target.querySelector("video");
   if(activeVideo!==video||video.paused)playVideo(video);
  }
 },{threshold:[0,0.7,1]});

 document.querySelectorAll(".video-card").forEach(card=>{
  observer.observe(card);
 });

 applyTab(currentTab);
}

function applyTab(category){
 currentTab=category;
 stopAllVideos();
 activeVideo=null;
 feed.scrollTop=0;

 document.querySelectorAll(".empty").forEach(item=>item.remove());

 let visibleCount=0;

 document.querySelectorAll(".video-card").forEach(card=>{
  const show=card.dataset.category===category;
  card.style.display=show?"flex":"none";
  if(show)visibleCount++;
 });

 if(visibleCount===0){
  const empty=document.createElement("div");
  empty.className="empty";

  const messages={
   all:"لا توجد فيديوهات حالياً",
   anime:"لا توجد فيديوهات أنمي حالياً",
   movies:"لا توجد فيديوهات أفلام حالياً",
   stories:"لا توجد قصص حالياً"
  };

  empty.textContent=messages[category];
  feed.appendChild(empty);
 }
}

 tab.onclick=()=>{
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  tab.classList.add("active");
  applyTab(tab.dataset.tab);
 };
});

};

uploadButton.onclick=()=>{

 fileInput.click();
};

function validateVideo(file){
 return new Promise((resolve,reject)=>{
  if(!file.type.startsWith("video/")){
   reject("الملف المختار مش فيديو");
   return;
  }

  if(file.size>50*1024*1024){
   reject("حجم الفيديو أكبر من 50 MB");
   return;
  }

  const video=document.createElement("video");
  video.preload="metadata";
  video.muted=true;

  video.onloadedmetadata=()=>{
   URL.revokeObjectURL(video.src);

   if(!Number.isFinite(video.duration)||video.duration<=0)
    reject("تعذر قراءة مدة الفيديو");
   else if(video.duration>90)
    reject("مدة الفيديو أطول من 90 ثانية");
   else if(video.videoHeight<=video.videoWidth)
    reject("لازم الفيديو يكون عمودي");
   else resolve(true);
  };

  video.onerror=()=>{
   URL.revokeObjectURL(video.src);
   reject("تعذر قراءة الفيديو");
  };

  video.src=URL.createObjectURL(file);
 });
}

fileInput.onchange=async()=>{
 const file=fileInput.files[0];
 if(!file)return;

 if(!currentUser){
  fileInput.value="";
  showAuth();
  return;
 }

 openModal();

 panelContent.innerHTML=`

 <textarea id="description" placeholder="اكتب وصف الفيديو (اختياري)"></textarea>
 <p id="status">جاري فحص الفيديو...</p>`;

 try{
  await validateVideo(file);
 }catch(error){
  showMessage(error);
  fileInput.value="";
  return;
 }

 panelContent.innerHTML=`
 <h2>نشر فيديو</h2>
 <textarea id="description" placeholder="اكتب وصف الفيديو (اختياري)"></textarea>
 <button class="action" id="publish">نشر الآن</button>
 <p class="note">الفيديو عمودي، مدته لا تتجاوز 90 ثانية وحجمه لا يتجاوز 50 MB.</p>
 <p id="status"></p>`;

 document.getElementById("publish").onclick=async()=>{
  const button=document.getElementById("publish");
  const description=document.getElementById("description").value.trim();

  button.disabled=true;
  showMessage("جاري رفع الفيديو... لا تغلق الصفحة");

  try{
   const {data:sessionData}=await db.auth.getSession();
   const user=sessionData.session?.user;

   if(!user)throw new Error("سجل دخولك من جديد");

   const ext=(file.name.split(".").pop()||"mp4").toLowerCase();
   const path=user.id+"/"+crypto.randomUUID()+"."+ext;

   const {error:uploadError}=await db.storage.from("videos")
    .upload(path,file,{contentType:file.type,upsert:false});

   if(uploadError)throw uploadError;

   const {data:urlData}=db.storage.from("videos").getPublicUrl(path);

   const {error:insertError}=await db.from("videos").insert({
    user_id:user.id,
    video_url:urlData.publicUrl,
    description
   });

   if(insertError){
    await db.storage.from("videos").remove([path]);
    throw insertError;
   }

   showMessage("تم نشر الفيديو بنجاح! 🎉");
   fileInput.value="";

   setTimeout(async()=>{
    closeModal();
    currentTab="all";

    document.querySelectorAll(".tab").forEach(t=>{
     t.classList.toggle("active",t.dataset.tab==="all");
    });

    await loadVideos();
   },1000);

  }catch(error){
   showMessage("حدث خطأ: "+error.message);
   button.disabled=false;
  }
 };
};

async function initialize(){
 const {data}=await db.auth.getSession();
 await updateUser(data.session?.user||null);
 await loadVideos();
}

initialize();
</script>

if(own){const out=document.createElement("button");out.className="action secondary";out.textContent="تسجيل الخروج";out.onclick=async()=>{await db.auth.signOut();await updateUser(null);closeModal();await loadVideos()};panelContent.appendChild(out)}const s=document.createElement("p");s.id="status";panelContent.appendChild(s)}
async function saveProfile(){const username=document.getElementById("newUsername").value.trim();if(username.length<3||username.length>24)return showMessage("اسم المستخدم لازم يكون من 3 إلى 24 حرفاً");const b=document.getElementById("saveProfile");b.disabled=true;showMessage("جاري حفظ الاسم...");const {error}=await db.from("profiles").upsert({id:currentUser.id,username},{onConflict:"id"});b.disabled=false;if(error){if(error.code==="23505")return showMessage("اسم المستخدم مستخدم من شخص آخر.");if(error.message.toLowerCase().includes("7 days")||error.message.toLowerCase().includes("seven"))return showMessage("لا يمكنك تغيير الاسم إلا مرة كل 7 أيام.");return showMessage("حدث خطأ: "+error.message)}currentProfile=await getProfile(currentUser.id);updateAvatarButton();showMessage("تم حفظ الملف الشخصي!");await showProfile(currentUser.id)}
avatarInput.onchange=async()=>{const f=avatarInput.files[0];if(!f)return;if(!f.type.startsWith("image/")){showMessage("اختار صورة فقط");avatarInput.value="";return}if(f.size>3*1024*1024){showMessage("حجم الصورة أكبر من 3 MB");avatarInput.value="";return}showMessage("جاري رفع صورة الحساب...");const ext=(f.name.split(".").pop()||"jpg").toLowerCase(),path=currentUser.id+"/"+crypto.randomUUID()+"."+ext;const {error:u}=await db.storage.from("avatars").upload(path,f,{contentType:f.type,upsert:false});if(u){showMessage("تعذر رفع الصورة: "+u.message);return}const {data}=db.storage.from("avatars").getPublicUrl(path);const {error:e}=await db.from("profiles").update({avatar_url:data.publicUrl}).eq("id",currentUser.id);if(e){showMessage("تم رفع الصورة لكن تعذر حفظها: "+e.message);return}currentProfile=await getProfile(currentUser.id);updateAvatarButton();showMessage("تم تغيير صورة الحساب!");await showProfile(currentUser.id);avatarInput.value=""};
accountButton.onclick=()=>showProfile();
db.auth.onAuthStateChange(async(_e,s)=>{await updateUser(s?.user||null)});
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function stopAllVideos(except=null){document.querySelectorAll(".video-card video").forEach(v=>{if(v!==except){v.pause();v.muted=true;v.closest(".video-card").classList.add("paused")}})}
function playVideo(v){stopAllVideos(v);v.muted=!soundEnabled;v.play().then(()=>{v.closest(".video-card").classList.remove("paused");activeVideo=v}).catch(()=>v.closest(".video-card").classList.add("paused"))}
function setupViewTracking(v,item,countEl){if(!item?.id)return;let timer=null,sent=false;v.addEventListener("playing",()=>{if(!currentUser||sent||viewedThisPage.has(item.id))return;clearTimeout(timer);timer=setTimeout(async()=>{if(!currentUser||v.paused||v.ended)return;sent=true;viewedThisPage.add(item.id);const {data,error}=await db.rpc("increment_video_views",{video_id:item.id});if(error){console.error(error);sent=false;viewedThisPage.delete(item.id);return}item.view_count=Number(data)||0;if(countEl)countEl.textContent="👁️ "+item.view_count+" مشاهدة"},2000)});v.addEventListener("pause",()=>clearTimeout(timer));v.addEventListener("ended",()=>clearTimeout(timer))}
function openVideoViewer(item){if(!item?.video_url)return;stopAllVideos();activeVideo=null;viewer.dataset.videoId=item.id||"";viewer.style.display="flex";viewerVideo.pause();viewerVideo.src=item.video_url;viewerVideo.load();document.getElementById("viewerViews").textContent="👁️ "+(item.view_count||0)+" مشاهدة";document.getElementById("viewerDescription").textContent=item.description||"";setupViewTracking(viewerVideo,item,document.getElementById("viewerViews"));viewerVideo.play().catch(()=>{})}
function closeVideoViewer(){viewerVideo.pause();viewerVideo.removeAttribute("src");viewerVideo.load();viewer.style.display="none";viewer.dataset.videoId=""}
document.getElementById("closeViewer").onclick=closeVideoViewer;viewer.addEventListener("click",e=>{if(e.target===viewer)closeVideoViewer()});
async function getSocialCounts(videoId){const [l,c]=await Promise.all([db.from("video_likes").select("id",{count:"exact",head:true}).eq("video_id",videoId),db.from("video_comments").select("id",{count:"exact",head:true}).eq("video_id",videoId)]);return {likes:l.count||0,comments:c.count||0}}
async function updateSocial(card,item){if(!item?.id)return;const counts=await getSocialCounts(item.id);const lc=card.querySelector(".like-count"),cc=card.querySelector(".comment-count");if(lc)lc.textContent=counts.likes;if(cc)cc.textContent=counts.comments;if(currentUser){const {data}=await db.from("video_likes").select("id").eq("video_id",item.id).eq("user_id",currentUser.id).maybeSingle();const b=card.querySelector(".like-btn");if(b)b.classList.toggle("liked",!!data)}}
async function toggleLike(item,card){if(!currentUser){showAuth();return}const b=card.querySelector(".like-btn");b.disabled=true;const {data,error}=await db.from("video_likes").select("id").eq("video_id",item.id).eq("user_id",currentUser.id).maybeSingle();if(error){alert("تعذر قراءة الإعجاب: "+error.message);b.disabled=false;return}let result;if(data)result=await db.from("video_likes").delete().eq("id",data.id);else result=await db.from("video_likes").insert({video_id:item.id,user_id:currentUser.id});b.disabled=false;if(result.error){alert("تعذر تحديث القلب: "+result.error.message);return}await updateSocial(card,item)}
async function showComments(item,card){openModal();panelContent.innerHTML=`<h2>التعليقات</h2><div class="comment-list" id="commentList"><p class="note">جاري تحميل التعليقات...</p></div><div class="comment-form"><input id="commentInput" maxlength="500" placeholder="اكتب تعليقك..."><button id="sendComment">إرسال</button></div><p id="status"></p>`;const list=document.getElementById("commentList");
const load=async()=>{list.innerHTML="<p class='note'>جاري تحميل التعليقات...</p>";const {data,error}=await db.from("video_comments").select("id,user_id,comment,created_at").eq("video_id",item.id).order("created_at",{ascending:true});if(error){list.innerHTML="<p>تعذر تحميل التعليقات: "+error.message+"</p>";return}list.innerHTML="";if(!data?.length){list.innerHTML="<p class='note'>لا توجد تعليقات بعد. كن أول من يعلق!</p>";return}const ids=[...new Set(data.map(x=>x.user_id))];const {data:profiles}=await db.from("profiles").select("id,username,avatar_url,is_verified").in("id",ids);const map={};(profiles||[]).forEach(p=>map[p.id]=p);data.forEach(x=>{const p=map[x.user_id]||{},row=document.createElement("div");row.className="comment-row";const img=document.createElement("img");img.className="comment-avatar";img.src=p.avatar_url||"";img.onerror=()=>{img.style.display="none"};const content=document.createElement("div");content.className="comment-content";const name=document.createElement("div");name.className="comment-user";name.textContent=p.username?"@"+p.username:"مستخدم";if(p.is_verified){const badge=document.createElement("span");badge.className="verified-badge";badge.style.width="14px";badge.style.height="14px";badge.style.fontSize="10px";badge.textContent="✓";name.appendChild(badge)}const txt=document.createElement("div");txt.className="comment-text";txt.textContent=x.comment;content.append(name,txt);if(currentUser&&x.user_id===currentUser.id){const del=document.createElement("button");del.className="comment-delete";del.textContent="حذف التعليق";del.onclick=async()=>{const {error}=await db.from("video_comments").delete().eq("id",x.id);if(error)alert(error.message);else{await load();await updateSocial(card,item)}};content.appendChild(del)}row.append(img,content);list.appendChild(row)})};
await load();document.getElementById("sendComment").onclick=async()=>{if(!currentUser){closeModal();showAuth();return}const input=document.getElementById("commentInput"),comment=input.value.trim();if(!comment)return;const b=document.getElementById("sendComment");b.disabled=true;const {error}=await db.from("video_comments").insert({video_id:item.id,user_id:currentUser.id,comment});b.disabled=false;if(error){showMessage("تعذر إرسال التعليق: "+error.message);return}input.value="";await load();await updateSocial(card,item)}}
function getVideoStoragePath(url){const marker="/storage/v1/object/public/videos/";try{const i=url.indexOf(marker);return i===-1?null:decodeURIComponent(url.substring(i+marker.length))}catch(e){return null}}
function createCard(url,description="",category="all",item=null){const card=document.createElement("section");card.className="video-card";card.dataset.category=category;const video=document.createElement("video");video.playsInline=true;video.setAttribute("webkit-playsinline","");video.preload="metadata";const source=document.createElement("source");source.src=url;source.type="video/mp4";video.appendChild(source);const play=document.createElement("button");play.className="play-button";play.textContent="▶";const info=document.createElement("div");info.className="video-info";const owner=document.createElement("div");owner.className="owner-name";if(item?.username){owner.textContent="@"+item.username;addVerifiedBadge(owner,item.is_verified);owner.onclick=e=>{e.stopPropagation();showProfile(item.user_id)}}else if(item?.user_id){owner.textContent="عرض الملف الشخصي";owner.onclick=e=>{e.stopPropagation();showProfile(item.user_id)}}const desc=document.createElement("p");desc.textContent=description;info.append(owner,desc);card.append(video,play,info);card.classList.add("paused");
if(item?.id){const actions=document.createElement("div");actions.className="social-actions";const like=document.createElement("button");like.className="social-btn like-btn";like.innerHTML='<span class="symbol">♥</span><span class="like-count">0</span>';like.onclick=e=>{e.stopPropagation();toggleLike(item,card)};const comments=document.createElement("button");comments.className="social-btn";comments.innerHTML='<span class="symbol">💬</span><span class="comment-count">0</span>';comments.onclick=e=>{e.stopPropagation();showComments(item,card)};actions.append(like,comments);card.appendChild(actions);updateSocial(card,item);setupViewTracking(video,item,null)}
if(item?.id&&currentUser&&item.user_id===currentUser.id){const del=document.createElement("button");del.className="delete-button";del.textContent="حذف الفيديو";del.onclick=async e=>{e.stopPropagation();if(!confirm("هل أنت متأكد من حذف هذا الفيديو؟"))return;del.disabled=true;const {error}=await db.from("videos").delete().eq("id",item.id).eq("user_id",currentUser.id);if(error){alert("تعذر حذف الفيديو: "+error.message);del.disabled=false;return}const path=getVideoStoragePath(url);if(path)await db.storage.from("videos").remove([path]);await loadVideos()};card.appendChild(del)}
card.addEventListener("click",e=>{if(e.target===play||e.target===video){if(video.paused)playVideo(video);else{video.pause();card.classList.add("paused")}}});video.addEventListener("ended",()=>card.classList.add("paused"));video.addEventListener("error",()=>card.classList.add("paused"));return card}
async function loadVideos(){stopAllVideos();activeVideo=null;feed.innerHTML="";let cards=[];oldVideos.forEach(u=>cards.push(createCard(u,"","all")));const {data,error}=await db.from("videos").select("id,user_id,video_url,description,created_at,view_count").order("created_at",{ascending:false});if(error)console.error(error);else if(data){const ids=[...new Set(data.map(v=>v.user_id).filter(Boolean))];let profiles={};if(ids.length){const r=await db.from("profiles").select("id,username,is_verified").in("id",ids);if(!r.error&&r.data)r.data.forEach(p=>profiles[p.id]=p)}data.forEach(v=>{const p=profiles[v.user_id]||{};cards.push(createCard(v.video_url,v.description||"","all",{...v,username:p.username||"",is_verified:p.is_verified===true}))})}shuffle(cards);cards.forEach(c=>feed.appendChild(c));animeVideos.forEach(v=>feed.appendChild(createCard(v.url,v.description||"","anime")));movieVideos.forEach(v=>feed.appendChild(createCard(v.url,v.description||"","movies")));storyVideos.forEach(v=>feed.appendChild(createCard(v.url,v.description||"","stories")));if(observer)observer.disconnect();observer=new IntersectionObserver(entries=>{const visible=entries.filter(e=>e.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio)[0];if(visible&&visible.intersectionRatio>=.7){const v=visible.target.querySelector("video");if(activeVideo!==v||v.paused)playVideo(v)}},{threshold:[0,.7,1]});document.querySelectorAll(".video-card").forEach(c=>observer.observe(c));applyTab(currentTab)}
function applyTab(cat){currentTab=cat;stopAllVideos();activeVideo=null;feed.scrollTop=0;document.querySelectorAll(".empty").forEach(x=>x.remove());let n=0;document.querySelectorAll(".video-card").forEach(c=>{const show=c.dataset.category===cat;c.style.display=show?"flex":"none";if(show)n++});if(!n){const e=document.createElement("div");e.className="empty";e.textContent=({all:"لا توجد فيديوهات حالياً",anime:"لا توجد فيديوهات أنمي حالياً",movies:"لا توجد فيديوهات أفلام حالياً",stories:"لا توجد قصص حالياً"})[cat];feed.appendChild(e)}}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));t.classList.add("active");applyTab(t.dataset.tab)});
soundButton.onclick=()=>{soundEnabled=!soundEnabled;if(activeVideo)activeVideo.muted=!soundEnabled;soundButton.textContent=soundEnabled?"🔊 الصوت مفتوح":"🔇 الصوت مغلق"};
uploadButton.onclick=()=>{if(currentTab!=="all"){alert("النشر متاح في قسم لك فقط");return}if(!currentUser){showAuth();return}fileInput.click()};
function validateVideo(file){return new Promise((resolve,reject)=>{if(!file.type.startsWith("video/"))return reject("الملف المختار مش فيديو");if(file.size>50*1024*1024)return reject("حجم الفيديو أكبر من 50 MB");const v=document.createElement("video");v.preload="metadata";v.muted=true;v.onloadedmetadata=()=>{URL.revokeObjectURL(v.src);if(!Number.isFinite(v.duration)||v.duration<=0)reject("تعذر قراءة مدة الفيديو");else if(v.duration>90)reject("مدة الفيديو أطول من 90 ثانية");else if(v.videoHeight<=v.videoWidth)reject("لازم الفيديو يكون عمودي");else resolve(true)};v.onerror=()=>{URL.revokeObjectURL(v.src);reject("تعذر قراءة الفيديو")};v.src=URL.createObjectURL(file)})}
fileInput.onchange=async()=>{const file=fileInput.files[0];if(!file)return;if(!currentUser){fileInput.value="";showAuth();return}openModal();panelContent.innerHTML=`<h2>نشر فيديو</h2><textarea id="description" placeholder="اكتب وصف الفيديو (اختياري)"></textarea><p id="status">جاري فحص الفيديو...</p>`;try{await validateVideo(file)}catch(e){showMessage(e);fileInput.value="";return}panelContent.innerHTML=`<h2>نشر فيديو</h2><textarea id="description" placeholder="اكتب وصف الفيديو (اختياري)"></textarea><button class="action" id="publish">نشر الآن</button><p class="note">الفيديو عمودي، مدته لا تتجاوز 90 ثانية وحجمه لا يتجاوز 50 MB.</p><p id="status"></p>`;document.getElementById("publish").onclick=async()=>{const b=document.getElementById("publish"),description=document.getElementById("description").value.trim();b.disabled=true;showMessage("جاري رفع الفيديو... لا تغلق الصفحة");try{const {data:s}=await db.auth.getSession(),user=s.session?.user;if(!user)throw new Error("سجل دخولك من جديد");const ext=(file.name.split(".").pop()||"mp4").toLowerCase(),path=user.id+"/"+crypto.randomUUID()+"."+ext;const {error:u}=await db.storage.from("videos").upload(path,file,{contentType:file.type,upsert:false});if(u)throw u;const {data:url}=db.storage.from("videos").getPublicUrl(path);const {error:i}=await db.from("videos").insert({user_id:user.id,video_url:url.publicUrl,description});if(i){await db.storage.from("videos").remove([path]);throw i}showMessage("تم نشر الفيديو بنجاح! 🎉");fileInput.value="";setTimeout(async()=>{closeModal();currentTab="all";document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.dataset.tab==="all"));await loadVideos()},1000)}catch(e){showMessage("حدث خطأ: "+e.message);b.disabled=false}}};
async function initialize(){const {data}=await db.auth.getSession();await updateUser(data.session?.user||null);await loadVideos()}initialize();
</script>
