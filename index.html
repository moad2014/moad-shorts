
<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MOAD SHORTS</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:white;font-family:Arial}
.feed{height:100dvh;overflow-y:auto;scroll-snap-type:y mandatory}
.video{height:100dvh;width:100%;scroll-snap-align:start;position:relative;background:#000}
video{width:100%;height:100%;object-fit:contain}
.logo{position:fixed;top:15px;left:15px;z-index:5;font-weight:bold;font-size:18px;text-shadow:0 2px 5px #000}
</style>
</head>
<body>
<div class="logo">MOAD SHORTS</div>
<div class="feed">
  <div class="video">
    <video autoplay muted loop playsinline controls>
      <source src="video1.mp4" type="video/mp4">
    </video>
  </div>
</div>
<script>
const videos=document.querySelectorAll('video');
const observer=new IntersectionObserver(entries=>{
 entries.forEach(entry=>{
  const v=entry.target;
  if(entry.isIntersecting){
   v.play().catch(()=>{});
  }else{
   v.pause();
  }
 });
},{threshold:0.6});
videos.forEach(v=>observer.observe(v));
</script>
</body>
</html>
