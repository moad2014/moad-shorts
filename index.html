
<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MOAD SHORTS</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:white;font-family:Arial}
header{position:fixed;top:15px;left:15px;z-index:5;font-size:20px;font-weight:bold;text-shadow:0 2px 5px black}
.feed{height:100dvh;overflow-y:scroll;scroll-snap-type:y mandatory}
.video-box{height:100dvh;width:100%;scroll-snap-align:start;background:#000;display:flex;align-items:center;justify-content:center}
video{
 width:100%;
 height:100%;
 object-fit:cover;
}
</style>
</head>
<body>
<header>MOAD SHORTS</header>
<div class="feed">
 <div class="video-box">
  <video autoplay muted loop playsinline controls>
   <source src="./2026-10-21-131624724.mp4" type="video/mp4">
   متصفحك لا يدعم الفيديو.
  </video>
 </div>
</div>
<script>
const videos=document.querySelectorAll("video");
const observer=new IntersectionObserver(entries=>{
 entries.forEach(entry=>{
  if(entry.isIntersecting){
   entry.target.play().catch(()=>{});
  }else{
   entry.target.pause();
  }
 });
},{threshold:0.6});
videos.forEach(v=>observer.observe(v));
</script>
</body>
</html>
