
<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MOAD SHORTS</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  background: black;
  overflow: hidden;
}

#feed {
  width: 100%;
  height: 100%;
  overflow-y: auto;
  scroll-snap-type: y mandatory;
  scrollbar-width: none;
}

#feed::-webkit-scrollbar {
  display: none;
}

.video-box {
  width: 100%;
  height: 100%;
  height: 100dvh;
  scroll-snap-align: start;
  background: black;
  position: relative;
}

video {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

.navigation {
  position: fixed;
  left: 15px;
  top: 50%;
  transform: translateY(-50%);
  z-index: 100;
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.navigation button {
  width: 48px;
  height: 48px;
  border: 1px solid #ffffff55;
  border-radius: 50%;
  background: #222222bb;
  color: white;
  font-size: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.navigation button:active {
  background: #555;
  transform: scale(0.9);
}
</style>
</head>

<body>

<div id="feed">

  <div class="video-box">
    <video playsinline muted loop controls preload="metadata">
      <source src="./2026-10-21-131624724.mp4" type="video/mp4">
    </video>
  </div>

  <div class="video-box">
    <video playsinline muted loop controls preload="metadata">
      <source src="./video2.mp4" type="video/mp4">
    </video>
  </div>

</div>

<div class="navigation">
  <button onclick="moveVideo(-1)" aria-label="الفيديو السابق">↑</button>
  <button onclick="moveVideo(1)" aria-label="الفيديو التالي">↓</button>
</div>

<script>
const feed = document.getElementById("feed");
const videos = [...document.querySelectorAll("video")];

let current = 0;
let moving = false;

function moveVideo(direction) {
  if (moving) return;

  const next = current + direction;

  if (next < 0 || next >= videos.length) return;

  current = next;
  moving = true;

  feed.scrollTo({
    top: current * feed.clientHeight,
    behavior: "smooth"
  });

  videos.forEach((video, index) => {
    if (index !== current) video.pause();
  });

  setTimeout(() => {
    videos[current].play().catch(() => {});
    moving = false;
  }, 400);
}

feed.addEventListener("scroll", () => {
  const index = Math.round(feed.scrollTop / feed.clientHeight);

  if (index >= 0 && index < videos.length && index !== current) {
    current = index;
    videos.forEach((video, i) => {
      if (i !== current) video.pause();
    });
    videos[current].play().catch(() => {});
  }
});
</script>

</body>
</html>
