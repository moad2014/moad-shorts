function daysUntilUsernameChange(profile){
 if(!profile?.username||!profile.username_changed_at)return 0;
 const remaining=7*24*60*60*1000-
  (Date.now()-new Date(profile.username_changed_at).getTime());
 return Math.max(0,Math.ceil(remaining/(24*60*60*1000)));
}

 element.appendChild(badge);
}

async function saveProfile(){
 const username=document.getElementById("newUsername").value.trim();
 if(username.length<3||username.length>24)
  return showMessage("اسم المستخدم لازم يكون من 3 إلى 24 حرفاً");

 const button=document.getElementById("saveProfile");
 button.disabled=true;
 showMessage("جاري حفظ الاسم...");

 const {error}=await db.from("profiles")
  .upsert({id:currentUser.id,username},{onConflict:"id"});

 button.disabled=false;

 if(error){
  if(error.code==="23505")
   return showMessage("اسم المستخدم مستخدم من شخص آخر. اختار اسماً مختلفاً.");
  if(error.message.toLowerCase().includes("7 days")||
     error.message.toLowerCase().includes("seven"))
   return showMessage("لا يمكنك تغيير اسم المستخدم إلا مرة كل 7 أيام.");
  return showMessage("حدث خطأ: "+error.message);
 }

 currentProfile=await getProfile(currentUser.id);
 updateAvatarButton();
 showMessage("تم حفظ الملف الشخصي بنجاح!");
 await showProfile(currentUser.id);
}

avatarInput.onchange=async()=>{
 const file=avatarInput.files[0];
 if(!file)return;
 if(!file.type.startsWith("image/")){
  showMessage("اختار صورة فقط");
  avatarInput.value="";
  return;
 }
 if(file.size>3*1024*1024){
  showMessage("حجم الصورة أكبر من 3 MB");
  avatarInput.value="";
  return;
 }

 showMessage("جاري رفع صورة الحساب...");
 const ext=(file.name.split(".").pop()||"jpg").toLowerCase();
 const path=currentUser.id+"/"+crypto.randomUUID()+"."+ext;

 const {error:uploadError}=await db.storage.from("avatars")
  .upload(path,file,{contentType:file.type,upsert:false});

 if(uploadError){
  showMessage("تعذر رفع الصورة: "+uploadError.message);
  avatarInput.value="";
  return;
 }

 const {data:urlData}=db.storage.from("avatars").getPublicUrl(path);
 const {error:updateError}=await db.from("profiles")
  .update({avatar_url:urlData.publicUrl}).eq("id",currentUser.id);

 if(updateError){
  showMessage("تم رفع الصورة لكن تعذر حفظها: "+updateError.message);
  return;
 }

 currentProfile=await getProfile(currentUser.id);
 updateAvatarButton();
 showMessage("تم تغيير صورة الحساب بنجاح!");
 await showProfile(currentUser.id);
 avatarInput.value="";
};

let musicLoadVersion=0;
function isMp4Track(track){
 return /\.mp4$/i.test(track.file_path||"");
}
async function loadMyMusic(){
 const list=document.getElementById("musicList");
 if(!list||!currentUser)return;
 const loadVersion=++musicLoadVersion;
 const userId=currentUser.id;
 list.innerHTML="<p class='note'>جاري تحميل الموسيقى...</p>";
 try{
  const {data,error}=await db.from("personal_music")
   .select("id,title,file_path").eq("user_id",userId)
   .order("created_at",{ascending:false});
  if(loadVersion!==musicLoadVersion)return;
  if(error){list.textContent="تعذر تحميل القائمة: "+error.message;return}
  list.innerHTML="";
  if(!data?.length){list.innerHTML="<p class='note'>ما ضفتش موسيقى لحد الآن. اضغط إضافة موسيقى للبدء.</p>";return}
  for(const track of data){
   const row=document.createElement("div");
   row.className="music-track";
   const name=document.createElement("span");
   name.className="music-track-name";
   name.textContent=(isMp4Track(track)?"🎬 ":"🎵 ")+(track.title||"موسيقى");
   row.appendChild(name);
   if(isMp4Track(track)){
    const preview=document.createElement("video");
    preview.className="music-preview";
    preview.controls=true;
    preview.playsInline=true;
    preview.preload="metadata";
    preview.muted=true;

function shuffle(items){
 for(let i=items.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [items[i],items[j]]=[items[j],items[i]];
 }
 return items;
}

function setupViewTracking(video,item){
 if(!video||!item?.id)return;

 video._viewItem=item;
 if(trackedVideos.has(video))return;
 trackedVideos.add(video);

 let timer=null;
 let sending=false;

 async function registerView(){
  const currentItem=video._viewItem;

  if(!currentItem?.id)return;
  if(video.paused||video.ended||video.currentTime<2)return;
  if(viewedThisPage.has(currentItem.id))return;
  if(sending)return;

  sending=true;

  try{
   const {data:sessionData,error:sessionError}=await db.auth.getSession();
   if(sessionError)throw sessionError;

   const user=sessionData.session?.user;
   if(!user){
    console.log("View tracking: user not logged in");
    return;
   }

   const {data,error}=await db.rpc(
    "increment_video_views",
    {video_id:currentItem.id}
   );

   if(error)throw error;

   const total=Number(data);
   if(!Number.isFinite(total)){
    throw new Error("Invalid view count: "+data);
   }

   viewedThisPage.add(currentItem.id);
   currentItem.view_count=total;

   console.log("View registered successfully:",currentItem.id,total);

  }catch(error){
   console.error("View count error:",error);
  }finally{
   sending=false;
  }
 }

 function scheduleView(){
  clearTimeout(timer);
  timer=setTimeout(()=>{
   if(!video.paused&&video.currentTime>=2){
    registerView();
   }
  },2000);
 }

 video.addEventListener("playing",scheduleView);

 video.addEventListener("timeupdate",()=>{
  if(video.paused||video.currentTime<2)return;
  if(!viewedThisPage.has(video._viewItem?.id)){
   registerView();
  }
 });

 video.addEventListener("pause",()=>clearTimeout(timer));
 video.addEventListener("ended",()=>clearTimeout(timer));
}

 feed.appendChild(createVimeoStory("1243599481","قصة يوتيوبر"));

 if(observer)observer.disconnect();

 observer=new IntersectionObserver(entries=>{
  const visible=entries
   .filter(entry=>entry.isIntersecting)
   .sort((a,b)=>b.intersectionRatio-a.intersectionRatio)[0];

  if(visible&&visible.intersectionRatio>=0.7){
   const video=visible.target.querySelector("video");
   if(activeVideo!==video||video.paused)playVideo(video);
  }
 },{threshold:[0,0.7,1]});

 document.querySelectorAll(".video-card").forEach(card=>observer.observe(card));
 applyTab(currentTab);
}

function validateVideo(file){
 return new Promise((resolve,reject)=>{
  if(!file.type.startsWith("video/")){
   reject("الملف المختار مش فيديو");
   return;
  }
  if(file.size>50*1024*1024){
   reject("حجم الفيديو أكبر من 50 MB");
   return;
  }

  const video=document.createElement("video");
  video.preload="metadata";
  video.muted=true;

  video.onloadedmetadata=()=>{
   URL.revokeObjectURL(video.src);

   if(!Number.isFinite(video.duration)||video.duration<=0)
    reject("تعذر قراءة مدة الفيديو");
   else if(video.duration>90)
    reject("مدة الفيديو أطول من 90 ثانية");
   else if(video.videoHeight<=video.videoWidth)
    reject("لازم الفيديو يكون عمودي");
   else resolve(true);
  };

  video.onerror=()=>{
   URL.revokeObjectURL(video.src);
   reject("تعذر قراءة الفيديو");
  };

  video.src=URL.createObjectURL(file);
 });
}

 if(!file)return;

 if(!currentUser){
  fileInput.value="";
  showAuth();
  return;
 }

 openModal();
 panelContent.innerHTML=`
 <h2>نشر فيديو</h2>
 <textarea id="description" placeholder="اكتب وصف الفيديو (اختياري)"></textarea>
 <p id="status">جاري فحص الفيديو...</p>`;

 try{
  await validateVideo(file);
 }catch(error){
  showMessage(error);
  fileInput.value="";
  return;
 }

 panelContent.innerHTML=`
 <h2>نشر فيديو</h2>
 <textarea id="description" placeholder="اكتب وصف الفيديو (اختياري)"></textarea>
 <button class="action" id="publish">نشر الآن</button>
 <p class="note">الفيديو عمودي، مدته لا تتجاوز 90 ثانية وحجمه لا يتجاوز 50 MB.</p>
 <p id="status"></p>`;

 document.getElementById("publish").onclick=async()=>{
  const button=document.getElementById("publish");
  const description=document.getElementById("description").value.trim();

  button.disabled=true;
  showMessage("جاري رفع الفيديو... لا تغلق الصفحة");

  try{
   const {data:sessionData}=await db.auth.getSession();
   const user=sessionData.session?.user;
   if(!user)throw new Error("سجل دخولك من جديد");

   const ext=(file.name.split(".").pop()||"mp4").toLowerCase();
   const path=user.id+"/"+crypto.randomUUID()+"."+ext;

   const {error:uploadError}=await db.storage.from("videos")
    .upload(path,file,{contentType:file.type,upsert:false});

   if(uploadError)throw uploadError;

   const {data:urlData}=db.storage.from("videos").getPublicUrl(path);

   const {error:insertError}=await db.from("videos").insert({
    user_id:user.id,
    video_url:urlData.publicUrl,
    description,
    view_count:0
   });

   if(insertError){
    await db.storage.from("videos").remove([path]);
    throw insertError;
   }

   showMessage("تم نشر الفيديو بنجاح! 🎉");
   fileInput.value="";

   setTimeout(async()=>{
    closeModal();
    currentTab="all";
    document.querySelectorAll(".tab").forEach(t=>
     t.classList.toggle("active",t.dataset.tab==="all")
    );
    await loadVideos();
   },1000);

  }catch(error){
   showMessage("حدث خطأ: "+error.message);
   button.disabled=false;
  }
 };
};

async function initialize(){
 const {data,error}=await db.auth.getSession();
 if(error)console.error(error);
 await updateUser(data.session?.user||null);
 await loadVideos();
}

initialize();
</script>

  });
